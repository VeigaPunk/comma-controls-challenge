[package]
name = "controls_beat"
version = "0.1.0"
edition = "2021"
description = "Tikhonov closed-form c* + model-free cost + fingerprint lookup builder"
license = "MIT"

[dependencies]
nalgebra = "0.33"
csv = "1.3"
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[lib]
name = "controls_beat"
path = "src/lib.rs"

[[bin]]
name = "controls_beat"
path = "src/main.rs"
